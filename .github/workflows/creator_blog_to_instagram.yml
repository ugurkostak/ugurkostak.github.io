name: Creator Blog to Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run creator pipeline
        env:
          BLOG_FEED_URL: ${{ secrets.BLOG_FEED_URL }}
          IG_CREATOR_USER_ID: ${{ secrets.IG_CREATOR_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DEFAULT_HASHTAGS: ${{ secrets.DEFAULT_HASHTAGS }}
          CTA_TEXT: ${{ secrets.CTA_TEXT }}
        run: python scripts/run_pipeline.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instagram-creator-agent-output
          path: photography/out/
